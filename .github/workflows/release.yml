name: Publish Release

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty to use pyproject.toml version)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
            test -n "$version"
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no changes made."
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## Changes
          - Updated the evaluator to the CONSORT 2025 reporting checklist.
          - Removed unsupported conversion of reporting completeness into Cochrane RoB 2 judgements.
          - Added stricter checklist and participant-flow validation.
          - Added a responsive browser application with light/dark themes and JSON/CSV export.
          - Corrected Python packaging and expanded CI across Python 3.9–3.13.
          - Added GitHub Pages deployment with post-deployment live HTTP smoke tests.

          The browser application processes checklist data locally and does not upload responses.
          EOF
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file /tmp/release-notes.md
