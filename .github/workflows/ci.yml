name: CONSORT RCT Checklist Evaluator CI
 
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Pytest Suite
      run: |
        python -m pytest -p no:zarr -v

    - name: Run CLI Batch Smoke Test
      run: |
        python cli.py batch -i sample.csv -o out_smoke.csv
        python -c "
        import csv
        with open('out_smoke.csv', 'r') as f:
            rows = list(csv.DictReader(f))
            assert len(rows) == 3, f'Expected 3 trials, got {len(rows)}'
            assert rows[0]['overall_quality_tier'] == 'HIGH_QUALITY'
        print('CLI batch smoke test passed successfully!')
        "
        rm out_smoke.csv
