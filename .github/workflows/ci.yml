name: CONSORT Checklist CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q cli.py consort_evaluator.py tests

      - name: Run tests
        run: python -m pytest -q

      - name: Run CLI batch smoke test
        run: |
          python cli.py batch -i sample.csv -o out_smoke.csv
          python - <<'PY'
          import csv
          with open("out_smoke.csv", encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 3
          assert rows[0]["standard_version"] == "CONSORT 2025"
          assert rows[0]["reporting_completeness_band"] == "HIGH_COMPLETENESS"
          print("CLI batch smoke test passed")
          PY

      - name: Validate browser JavaScript syntax
        run: node --check site/app.js

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          consort-rct-checklist-evaluator --full-compliance --json > package_smoke.json
          python - <<'PY'
          import json
          with open("package_smoke.json", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["standard_version"] == "CONSORT 2025"
          assert report["overall_completion_percentage"] == 100.0
          PY
          python -m pip check
