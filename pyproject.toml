[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consort-rct-checklist-evaluator"
version = "3.0.0"
description = "CONSORT 2025 reporting checklist evaluator for randomized-trial reports"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
consort-rct-checklist-evaluator = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/consort-rct-checklist-evaluator"
Repository = "https://github.com/abusuraihsakhri/consort-rct-checklist-evaluator.git"

[tool.setuptools]
py-modules = ["cli", "consort_evaluator"]
