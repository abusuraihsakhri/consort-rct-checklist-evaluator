[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consort-rct-checklist-evaluator"
version = "2.0.0"
description = "CONSORT-Master: Randomized Controlled Trial Reporting Guideline Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
consort-rct-checklist-evaluator = "consort_master.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/consort-rct-checklist-evaluator"
Repository = "https://github.com/abusuraihsakhri/consort-rct-checklist-evaluator.git"
